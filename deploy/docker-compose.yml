services:
  mysql:
    image: mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209
    container_name: sourcelens-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: sourcelens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend-spring/Dockerfile
    container_name: sourcelens-backend
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://sourcelens-mysql:3306/sourcelens?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: sourcelens-redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPT_PASSWORD: ${ENCRYPT_PASSWORD}
      ENCRYPT_SALT: ${ENCRYPT_SALT}
      SOURCELENS_WORKSPACE: /var/lib/sourcelens/repos
      SOURCELENS_SANDBOX_EXECUTOR: docker
      SOURCELENS_SANDBOX_DOCKER_NETWORK: none
      SOURCELENS_SANDBOX_DOCKER_USER: "1000:1000"
      SOURCELENS_SANDBOX_DOCKER_PIDS_LIMIT: "256"
      SOURCELENS_SANDBOX_DOCKER_READ_ONLY_ROOT: "true"
      SOURCELENS_SANDBOX_DOCKER_TMPFS: /tmp:rw,noexec,nosuid,size=64m
      SOURCELENS_ALLOW_PAT_CREDENTIALS: "false"
      SOURCELENS_ALLOW_LOCAL_FILE_REPOS: "false"
      SOURCELENS_WORKSPACE_SANDBOX_CLEANUP_ENABLED: ${SOURCELENS_WORKSPACE_SANDBOX_CLEANUP_ENABLED:-false}
      SOURCELENS_WORKSPACE_SANDBOX_RETENTION_HOURS: ${SOURCELENS_WORKSPACE_SANDBOX_RETENTION_HOURS:-24}
      SOURCELENS_WORKSPACE_SANDBOX_CLEANUP_BATCH_SIZE: ${SOURCELENS_WORKSPACE_SANDBOX_CLEANUP_BATCH_SIZE:-100}
      SOURCELENS_ARTIFACT_CLEANUP_ENABLED: ${SOURCELENS_ARTIFACT_CLEANUP_ENABLED:-false}
      SOURCELENS_ARTIFACT_RETENTION_DAYS: ${SOURCELENS_ARTIFACT_RETENTION_DAYS:-30}
      SOURCELENS_ARTIFACT_CLEANUP_BATCH_SIZE: ${SOURCELENS_ARTIFACT_CLEANUP_BATCH_SIZE:-200}
      SOURCELENS_AUDIT_CLEANUP_ENABLED: ${SOURCELENS_AUDIT_CLEANUP_ENABLED:-false}
      SOURCELENS_AUDIT_RETENTION_DAYS: ${SOURCELENS_AUDIT_RETENTION_DAYS:-90}
      SOURCELENS_AUDIT_CLEANUP_BATCH_SIZE: ${SOURCELENS_AUDIT_CLEANUP_BATCH_SIZE:-500}
      SOURCELENS_EXECUTION_LOG_CLEANUP_ENABLED: ${SOURCELENS_EXECUTION_LOG_CLEANUP_ENABLED:-false}
      SOURCELENS_EXECUTION_LOG_RETENTION_DAYS: ${SOURCELENS_EXECUTION_LOG_RETENTION_DAYS:-30}
      SOURCELENS_EXECUTION_LOG_CLEANUP_BATCH_SIZE: ${SOURCELENS_EXECUTION_LOG_CLEANUP_BATCH_SIZE:-1000}
    volumes:
      - backend-repos:/var/lib/sourcelens/repos
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  backend-repos:
