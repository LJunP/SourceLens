# dev profile: 本地开发环境
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/sourcelens?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:${MYSQL_USER:sourcelens}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:sourcelens123}}
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}

logging:
  level:
    com.baomidou.mybatisplus: WARN
    org.mybatis: WARN

sourcelens:
  workspace:
    base-path: /tmp/sourcelens/repos
  repository:
    allow-local-file: true
  analyzer:
    path: ${ANALYZER_PATH:${SOURCELENS_ANALYZER_PATH:bin/sourcelens-analyzer}}
