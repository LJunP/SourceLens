# prod profile: 生产环境
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/sourcelens}
    username: ${DB_USERNAME:sourcelens}
    password: ${DB_PASSWORD:sourcelens123}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

sourcelens:
  jwt:
    secret: ${JWT_SECRET}
  workspace:
    base-path: ${SOURCELENS_WORKSPACE:/var/lib/sourcelens/repos}
  encrypt:
    password: ${ENCRYPT_PASSWORD}
    salt: ${ENCRYPT_SALT}