[package]
name = "sourcelens-analyzer"
version = "0.1.0"
edition = "2021"
description = "SourceLens Code Analyzer - 扫描仓库结构、识别框架、提取代码元素"

[[bin]]
name = "sourcelens-analyzer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
regex = "1"