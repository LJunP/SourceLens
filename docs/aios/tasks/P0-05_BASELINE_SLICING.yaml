acceptance_criteria:
  - Every tracked modification and non-ignored untracked path is assigned exactly once to review slice A through G or explicitly marked unresolved.
  - Each slice records exact paths, dependencies, migration disposition, targeted tests, known failures and an independent verdict.
  - No user work is deleted, reverted, stashed, reformatted or overwritten to manufacture a clean status.
  - Every accepted checkpoint identifies its exact Git tree and can be reconciled against both the captured starting-state snapshot and the externally attested exact post-remediation snapshot.
  - The resulting P1 candidate baseline records migrations, lockfiles, tool versions, build and test commands, skips and residual risks.
  - The Truth Registry changes only after evidence and independent review exist.
required_evidence:
  - binary-safe status and path inventory for the starting state
  - slice ownership manifest with no overlapping path owners
  - per-slice dependency and migration-disposition report
  - exact targeted command output and independent verdict for each accepted slice
  - checkpoint commit or tree identifiers and rollback instructions
  - final candidate-baseline manifest with reproduction commands

independent_reviewer: Quality and Evaluation Agent
additional_reviewers:
  - CTO Agent for all slices
  - Security Agent for slices B, D and E
  - Chief AI Research Agent for slices C and D
  - Product Intelligence Agent for slices A, F and G

stop_conditions:
  - A preserved-snapshot hash or reconstruction check fails.
  - A path has multiple owners or cannot be assigned without first understanding a dependency.
  - Partitioning would require source-content changes, destructive Git operations or loss of user work.
  - A slice fails its declared targeted gate and cannot be separated safely.
  - The task expands into P1 implementation, feature development or broad refactoring.
forbidden_actions:
  - git reset --hard, git clean, destructive checkout, automatic stash or history rewrite
  - deleting, moving, reformatting or rewriting inherited source merely to simplify the baseline
  - modifying business behavior while classifying or checkpointing a slice
  - declaring a capability accepted from the aggregate inherited release package alone
  - entering P1 or enabling model writes, shell execution, real-provider source egress, remote PR submission or autonomous merge

status: ready
